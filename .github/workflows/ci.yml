name: CI

on:
  pull_request:
  push:
    branches: [Main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests de dominio
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mdw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mdw_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mdw_e2e?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mdw_e2e?schema=public
      AUTH_SECRET: e2e-auth-secret-ci-only-123456789012345678901234
      AUTH_GOOGLE_ID: e2e-google-id
      AUTH_GOOGLE_SECRET: e2e-google-secret
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      APP_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones en la base E2E
        run: npx prisma migrate deploy

      - name: Compilar la aplicación
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Flujo, permisos y concurrencia
        run: npm run test:e2e

      - name: Guardar evidencia si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
